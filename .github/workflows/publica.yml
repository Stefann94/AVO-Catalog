# ═══════════════════════════════════════════════════════════════════════════
# CONSTRUIEȘTE SITE-UL ȘI ÎL URCĂ PE HOSTICO
# ═══════════════════════════════════════════════════════════════════════════
#
# ─── DE CE AICI, ȘI NU PE SERVER ──────────────────────────────────────────
#
# Hostico nu poate lua singur codul de pe GitHub — nu are funcția asta, și nu
# are nici Node ca să construiască site-ul. Dar are FTP, ca orice cPanel.
#
# Deci direcția se inversează: GitHub construiește și TRIMITE. Găzduirea nu
# trebuie să știe nimic despre GitHub, despre Node sau despre Next. Primește
# fișiere, exact ca atunci când le-ar urca cineva de mână — doar că nu le urcă
# nimeni de mână, și nu se mai face nicio arhivă.
#
# ─── CÂND PORNEȘTE ────────────────────────────────────────────────────────
#
#   push pe main ......... s-a schimbat codul;
#   noaptea, la 03:10 .... plasa de siguranță: dacă s-a schimbat un preț în
#                          WooCommerce și semnalul s-a pierdut, site-ul e
#                          oricum proaspăt dimineața;
#   semnal din WordPress . `repository_dispatch`, trimis la salvarea unui
#                          produs. Site-ul se actualizează în 2–3 minute;
#   manual ............... butonul „Run workflow", pentru când vrei tu.
#
# ─── UNDE AJUNGE, ȘI DE CE ACOLO ──────────────────────────────────────────
#
# Contul are trei domenii, fiecare cu folderul lui, niciunul peste celălalt:
#
#   avogrupinvest.ro ......... /public_html     site-ul de prezentare
#                                               (WordPress, clonat pe 30.09)
#   admin.avogrupinvest.ro ... /wordpress       WordPress-ul care ține
#                                               produsele — backend-ul
#   catalog.avogrupinvest.ro . /catalog-static  ← aici publicăm
#
# Despărțirea asta a fost făcută pe 30 septembrie. Înainte, `avogrupinvest.ro`
# și `admin.` serveau amândouă din `/public_html`, iar publicarea acolo ar fi
# suprascris `.htaccess`-ul WordPress-ului: `/graphql` și toate paginile lui ar
# fi dat 404. Acum nu mai există riscul — în `/catalog-static` nu stă nimic
# altceva.
#
# CATALOGUL E ÎNCHIS CU PAROLĂ. Regulile sunt în `public/.htaccess`, nu puse
# din cPanel, tocmai fiindcă publicarea asta trimite fișierul peste cel de pe
# server. Motivul închiderii: prețurile nu sunt încă verificate. Vezi
# explicația lungă din capul lui `public/.htaccess`.
#
# ─── CE TREBUIE PUS ÎN GITHUB ÎNAINTE SĂ MEARGĂ ───────────────────────────
#
# Settings → Secrets and variables → Actions → New repository secret:
#
#   FTP_SERVER ..... adresa serverului FTP (din cPanel → FTP Accounts →
#                    Configure FTP Client), de ex. ftp.avogrupinvest.ro
#   FTP_USER ....... numele contului FTP, întreg
#   FTP_PAROLA ..... parola lui
#
# Parola NU se scrie niciodată în fișierul ăsta și nu apare în jurnalele
# construcției.

name: Publică site-ul

on:
  push:
    branches: [main]
    # Ce NU declanșează o publicare.
    #
    # O publicare înseamnă ~25 de minute de construit și urcat. Merită doar
    # dacă se schimbă ceva ce ajunge pe site. Fișierele de mai jos nu ajung:
    # unealta de mutare rulează separat, la cerere, iar documentația și
    # măsurătorile trăiesc doar în depozit.
    #
    # Atenție la ce NU e în listă: `tools/imagini/` și `tools/static/` chiar
    # influențează ce iese, deci modificările lor trebuie publicate.
    paths-ignore:
      - "tools/hostico/**"
      - "tools/masurare/**"
      - "tools/captura/**"
      - ".github/workflows/mutare.yml"
      - "docs/**"
      - "**/*.md"
  schedule:
    # 03:10 UTC, adică 05:10 sau 06:10 la noi, după anotimp. Ora e aleasă în
    # afara orelor de lucru: dacă ceva pică, nimeni nu prinde site-ul la mijloc.
    - cron: "10 3 * * *"
  repository_dispatch:
    types: [catalog-modificat]
  workflow_dispatch:

# Două construcții în paralel ar urca fișiere una peste alta, în altă ordine
# decât au fost produse. Se anulează cea veche: ce contează e ultima stare.
concurrency:
  group: publica
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    # Ridicat de la 30, fiindcă 30 n-au ajuns: prima urcare a fost oprită la
    # 25,9 minute, cu urcarea încă în curs.
    #
    # Motivul e FTP-ul: fiecare fișier e o cerere separată, iar site-ul are
    # ~3000 de fișiere — 215 pagini, dar și 2181 de fotografii și încărcăturile
    # de navigare ale lui Next. Urcările următoare trimit doar ce s-a schimbat,
    # deci sunt de ordinul secundelor; doar prima le trimite pe toate.
    timeout-minutes: 120

    # Aici, nu pe pas: `secrets` nu se poate citi într-un `if`, iar un `env`
    # scris pe pas nu e vizibil în propriul lui `if`. La nivel de job, e.
    env:
      ARE_FTP: ${{ secrets.FTP_SERVER != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fotografiile descărcate din WordPress, păstrate între rulări.
      #
      # Fără ele, fiecare construcție descarcă din nou toate cele 140, deși
      # aproape niciuna nu se schimbă. Pe găzduire partajată asta a avut
      # consecințe reale: filtrul anti-bot a blocat IP-ul de pe care se
      # construia, după câteva construcții într-o zi.
      #
      # Cheia e unică pe rulare, deci nu se potrivește niciodată exact, deci
      # la final se salvează mereu o copie proaspătă. `restore-keys: poze-`
      # ia la început cea mai recentă copie de dinainte. Așa memoria crește cu
      # fotografiile noi, în loc să înghețe la prima versiune.
      #
      # Memoria e legată de ADRESA fotografiei. Dacă cineva înlocuiește
      # conținutul uneia păstrând exact același nume de fișier, ar rămâne
      # varianta veche. Se golește schimbând prefixul de mai jos, de exemplu
      # în `poze2-`.
      - name: Ia fotografiile din memorie
        uses: actions/cache@v4
        with:
          path: .cache-poze
          key: poze-${{ github.run_id }}
          restore-keys: poze-

      - name: Verifică stilul codului
        run: npx eslint src next.config.ts

      # AICI A FOST UN `npx tsc --noEmit` SEPARAT. L-am scos, fiindcă eșua.
      #
      # Next generează în `.next/types` declarații pentru fiecare rută, iar
      # tsconfig.json le include. Pe calculatorul meu existau din construcțiile
      # de dinainte, deci verificarea trecea. Pe un cod proaspăt descărcat nu
      # există încă, iar `tsc` cădea pe fișiere lipsă — o eroare despre starea
      # folderului, nu despre cod.
      #
      # Pasul era oricum în plus: `next build` rulează el însuși verificarea de
      # tipuri („Running TypeScript"), DUPĂ ce generează declarațiile. O
      # greșeală reală de tipuri tot oprește construcția de mai jos.

      # `next build` scoate paginile; pregateste-static.mjs produce
      # fotografiile și rescrie adresele. Dacă o fotografie nu poate fi
      # produsă, se oprește aici — mai bine nicio publicare decât una cu poze
      # rupte.
      - name: Construiește
        env:
          # Din ea ies canonical-urile fiecărei pagini, sitemap.xml, robots.txt
          # și datele structurate (vezi src/lib/site.ts). Lăsată pe
          # `www.avogrupinvest.ro`, fiecare fișă de produs i-ar spune lui Google
          # „varianta adevărată a mea e pe domeniul principal" — unde de pe 30
          # septembrie stă cu totul alt site.
          NEXT_PUBLIC_SITE_URL: https://catalog.avogrupinvest.ro
        run: npm run build

      # Verificare de plasă: o construcție „reușită" care a scos zero pagini
      # ar șterge site-ul la urcare.
      - name: Verifică ce a ieșit
        run: |
          pagini=$(find out -name "*.html" | wc -l)
          poze=$(find out/i -name "*.avif" 2>/dev/null | wc -l)
          echo "pagini: $pagini, fotografii: $poze"
          if [ "$pagini" -lt 200 ]; then echo "PREA PUȚINE PAGINI"; exit 1; fi
          if [ "$poze" -lt 1000 ]; then echo "PREA PUȚINE FOTOGRAFII"; exit 1; fi
          test -f out/.htaccess || { echo "LIPSEȘTE .htaccess"; exit 1; }

      # Urcă DOAR ce s-a schimbat. Acțiunea ține pe server un fișier cu starea
      # ultimei publicări și compară; la a doua publicare se mișcă câteva
      # zeci de fișiere, nu 85 MB.
      # Cât timp datele de FTP nu sunt puse în GitHub, pasul se SARE, nu
      # eșuează. Altfel fiecare urcare de cod ar lăsa un X roșu care nu
      # înseamnă nimic — iar un semnal de alarmă care sună mereu încetează să
      # mai fie ascultat. Construcția și verificările de mai sus rulează
      # oricum, deci o greșeală tot e prinsă.
      #
      # `secrets` nu se poate citi direct într-un `if`, de-aici ocolul prin
      # env-ul de mai jos.
      - name: Urcă pe Hostico
        if: env.ARE_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PAROLA }}
          local-dir: ./out/
          # ─── ACUM MERGE DIRECT PE SITE ───────────────────────────────
          #
          # Prima urcare a mers într-un folder alăturat, `/site-nou/`, și de
          # acolo a fost mutată la locul ei. Motivul era timpul: site-ul are
          # ~3000 de fișiere, iar prin FTP prima urcare durează zeci de
          # minute. Trimise direct aici, site-ul ar fi rămas jumătate vechi,
          # jumătate nou în tot acel timp.
          #
          # Acum fișierele sunt deja pe server și se trimite doar ce s-a
          # schimbat, deci urcarea e scurtă și nu mai are sens ocolul.
          #
          # Dacă vreodată se reface totul de la zero — alt server, alt cont —
          # se pune la loc `/site-nou/` aici, se lasă urcarea să se termine,
          # și apoi se rulează workflow-ul „Mută site-ul la locul lui".
          server-dir: /catalog-static/
          # A FOST `/public_html/`. Mutat pe 30 septembrie, când catalogul a
          # primit subdomeniul lui. Fișierele erau deja acolo — au fost mutate
          # de mână, cu tot cu `.ftp-deploy-sync-state.json`, fișierul în care
          # acțiunea ține minte ce a urcat. Deci prima publicare în folderul
          # nou NU retrimite cele ~2200 de fotografii: le recunoaște.
          #
          # Lista de mai jos avea și `wp-admin/**`, `wp-content/**`, `wp-*.php`
          # și celelalte, fiindcă WordPress stătea în același folder și
          # publicarea șterge tot ce nu e în `out`. Acum nu mai are ce păzi:
          # în `/catalog-static` nu e decât catalogul.
          #
          # `.ftpquota` e al cPanel-ului, nu al nostru. Șters, l-ar reface
          # serverul, dar n-are rost să-l ștergem la fiecare publicare.
          exclude: |
            **/.git*
            **/.git*/**
            .ftpquota
