# WordPress + WooCommerce pentru COPIA DE TEST a solarone.ro.
#
# Separat intenționat de tools/wp-local (8090), care e oglinda WordPress-ului
# firmei. Aici intră cele 397 de produse importate din OpenCart; acolo nu.
# Are propriul nume de proiect Docker și propriile volume, deci un
# `docker compose down -v` aici nu atinge niciun alt mediu de pe calculator.
#
# Pornire + configurare:   ./configureaza.sh
# Oprire:                  docker compose down          (păstrează datele)
# Ștergere:                docker compose down -v       (de la zero)
#
# WordPress: http://localhost:8093   ·   admin / admin
# GraphQL:   http://localhost:8093/graphql
#
# Porturi ocupate pe calculator: 8090 (wp-local), 8091/8092 (OpenCart
# solarone.ro local). Alt port: variabila PORT_WP în .env lângă acest fișier.

name: avo-wp-test

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - date-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT_WP:-8093}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_MEMORY_LIMIT', '512M');
    volumes:
      - date-wp:/var/www/html
      # Revalidarea la salvare și câmpurile de catalog, aceleași ca în producție.
      - ../wordpress:/var/www/html/wp-content/plugins/avo-legatura
      # Câmpurile proprii ale magazinului de test: brand, specificații, SEO.
      - ./plugin:/var/www/html/wp-content/plugins/avo-magazin

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      # Importul a sute de produse cu imagini depășește limita implicită.
      PHP_MEMORY_LIMIT: 1024M
    volumes:
      - date-wp:/var/www/html
      - ../wordpress:/var/www/html/wp-content/plugins/avo-legatura
      - ./plugin:/var/www/html/wp-content/plugins/avo-magazin
      # Datele transformate și scriptul de import, doar citire.
      - ../import-opencart:/import:ro
      # Repo-ul întreg, doar citire: pozele de rezervă din poze-*/ până vine arhiva.
      - ../..:/repo:ro
      - ../wp-local/plugins-externe:/plugins-externe:ro
    user: "33:33"
    entrypoint: ["wp"]
    profiles: ["cli"]

volumes:
  date-db:
  date-wp:
